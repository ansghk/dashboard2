let msBusy = false;

function goalsFor(dept){
  const g = state.data && state.data.goals;
  return (g && g[dept]) ? g[dept] : [];
}

async function msRequest(params){
  const qs = Object.entries(params).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&');
  const res = await fetch(API_URL + '?' + qs, { cache:'no-store' });
  const text = await res.text();
  if(!res.ok) throw new Error('HTTP ' + res.status + ' · ' + text.slice(0,120));
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error('서버가 JSON을 반환하지 않음 · ' + text.slice(0,120)); }
  if(data && data.ok === false) throw new Error(data.error || '서버가 실패를 반환했습니다.');
  return data;
}

function msRefresh(){
  return fetch(API_URL, { cache:'no-store' })
    .then(r=>r.json())
    .then(d=>{ state.data = d; render(); return d; })
    .catch(()=>null);
}

async function msAddGoal(dept, title, target, unit, desc, btn){
  if(msBusy) return;
  msBusy = true;
  if(btn){ btn.disabled = true; btn.textContent = '등록 중…'; }
  try{
    await msRequest({ action:'goalAdd', dept:dept, title:title, target:target, unit:unit, desc:desc });
    const fresh = await msRefresh();
    const saved = !!(fresh && fresh.goals && (fresh.goals[dept] || []).some(g => String(g.title).trim() === title));
    if(!saved){
      alert('요청은 전송됐지만 서버에 저장되지 않았습니다.\n→ Code.gs의 goalAdd 처리부를 확인해주세요.');
    }
  }catch(e){
    alert('목표 등록 실패\n' + (e && e.message ? e.message : e));
  }finally{
    msBusy = false;
    const b = document.querySelector('[data-ms-add="' + dept + '"]');
    if(b){ b.disabled = false; b.textContent = '목표등록'; }
  }
}

async function msUpdateGoal(dept, id, delta){
  const goal = goalsFor(dept).find(g => String(g.id) === String(id));
  if(!goal) return;
  const next = Math.max(0, Number(goal.current) + delta);
  if(next === Number(goal.current)) return;
  goal.current = next;
  render();
  try{
    await msRequest({ action:'goalUpdate', id:id, delta:delta });
  }catch(e){
    goal.current = Math.max(0, next - delta);
    render();
  }
}

async function msDeleteGoal(dept, id, title){
  if(!confirm('"' + title + '" 목표를 삭제할까요?')) return;
  const list = goalsFor(dept);
  const idx = list.findIndex(g => String(g.id) === String(id));
  if(idx !== -1) list.splice(idx, 1);
  render();
  try{
    await msRequest({ action:'goalDelete', id:id });
    msRefresh();
  }catch(e){
    alert('삭제 실패했습니다.');
    msRefresh();
  }
}

const MS_ARCHIVE_KEY = 'cultureDashboard_msArchive_v1';
const MS_LAST_MONTH_KEY = 'cultureDashboard_msLastMonth_v1';

function monthKeyOf(date){
  const d = date || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function msArchiveLoad(){
  try{
    const raw = localStorage.getItem(MS_ARCHIVE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function msArchiveSave(archive){
  try{ localStorage.setItem(MS_ARCHIVE_KEY, JSON.stringify(archive)); }catch(e){}
}

let msResetBusy = false;
let msResetDoneKey = null;

const MS_AUTO_RESET_ENABLED = false;

async function checkMonthlyMilestoneReset(){
  if(!state.data || !state.data.goals || msResetBusy) return;

  const nowKey = monthKeyOf();
  if(msResetDoneKey === nowKey) return;

  let lastKey = null;
  try{ lastKey = localStorage.getItem(MS_LAST_MONTH_KEY); }catch(e){}

  if(lastKey === null){
    try{ localStorage.setItem(MS_LAST_MONTH_KEY, nowKey); }catch(e){}
    msResetDoneKey = nowKey;
    return;
  }

  if(lastKey === nowKey){ msResetDoneKey = nowKey; return; }

  msResetBusy = true;
  try{ localStorage.setItem(MS_LAST_MONTH_KEY, nowKey); }catch(e){}
  msResetDoneKey = nowKey;
  try{
    const archive = msArchiveLoad();
    const snapshot = {};
    DEPTS.forEach(dept=>{
      const goals = goalsFor(dept);
      if(goals.length) snapshot[dept] = goals.map(g => ({ ...g }));
    });
    if(Object.keys(snapshot).length){
      const existing = archive[lastKey] || {};
      archive[lastKey] = { ...existing, ...snapshot };
      msArchiveSave(archive);
    }

    if(!MS_AUTO_RESET_ENABLED) return;

    const deleteJobs = [];
    DEPTS.forEach(dept=>{
      goalsFor(dept).forEach(g=>{
        deleteJobs.push(msRequest({ action:'goalDelete', id:g.id }).catch(()=>{}));
      });
      state.data.goals[dept] = [];
    });
    await Promise.all(deleteJobs);
  } finally {
    msResetBusy = false;
  }
}

function shiftMonthKey(monthKey, delta){
  const [y, m] = monthKey.split('-').map(Number);
  return monthKeyOf(new Date(y, (m - 1) + delta, 1));
}

const msHistoryCache = {};
const msHistoryPending = {};

function msHistoryLoad(monthKey, callback){
  if(msHistoryCache[monthKey] !== undefined){
    if(callback) callback();
    return;
  }
  if(msHistoryPending[monthKey]) return;
  msHistoryPending[monthKey] = true;
  fetch(API_URL + '?action=goalHistory&month=' + encodeURIComponent(monthKey), { cache:'no-store' })
    .then(r => r.json())
    .then(d => { msHistoryCache[monthKey] = (d && d.goals) ? d.goals : {}; })
    .catch(() => { msHistoryCache[monthKey] = null; })
    .then(() => { 
      msHistoryPending[monthKey] = false; 
      if(callback) callback(); else render();
    });
}

function msArchiveSection(dept){
  const isOpen = state.msArchiveOpen.has(dept);

  const nowKey = monthKeyOf();
  if(!state.msArchiveMonth[dept]) state.msArchiveMonth[dept] = shiftMonthKey(nowKey, -1);
  const viewKey = state.msArchiveMonth[dept];

  let goals = [];
  let loading = false;

  if(isOpen){
    const server = msHistoryCache[viewKey];
    if(server === undefined){
      msHistoryLoad(viewKey);
      loading = true;
    } else if(server === null){
      const archive = msArchiveLoad();
      goals = (archive[viewKey] && archive[viewKey][dept]) || [];
    } else {
      goals = server[dept] || [];
      if((!goals || !goals.length) && msArchiveLoad()[viewKey]?.[dept]){
        goals = msArchiveLoad()[viewKey][dept];
      }
    }
  }

  const doneCount = goals.filter(g => Number(g.current) >= Number(g.target)).length;

  const rows = loading
    ? `<div class="ms-archive-empty">시트에서 지난 마일스톤 불러오는 중…</div>`
    : (goals.length
      ? goals.map(g=>{
          const cur = Number(g.current), tgt = Math.max(1, Number(g.target));
          const done = cur >= tgt;
          const unit = escapeHtml(g.unit || '건');
          return `<div class="ms-archive-row">${done ? '✅' : '▫️'} <span class="ms-archive-row-title">${escapeHtml(g.title)}</span><span class="ms-archive-row-count mono">${cur} / ${tgt} ${unit}</span></div>`;
        }).join('')
      : `<div class="ms-archive-empty">이 달의 기록이 없습니다.</div>`);

  const [vy, vm] = viewKey.split('-');
  const canGoNext = viewKey < nowKey;

  return `
    <div class="ms-archive${isOpen ? ' open' : ''}" data-ms-archive-panel="${dept}">
      <button class="ms-archive-toggle" data-ms-archive-toggle="${dept}">
        <span class="ms-archive-chevron"></span>
        <span>지난 마일스톤 기록 보기 (${vy}.${vm})</span>
      </button>
      <div class="ms-archive-body">
        <div class="ms-archive-nav">
          <button class="ms-archive-nav-btn" data-ms-archive-prev="${dept}">‹</button>
          <span class="ms-archive-nav-label mono">${vy}.${vm}${(!loading && goals.length) ? ` · ${doneCount}/${goals.length} 달성` : ''}</span>
          <button class="ms-archive-nav-btn" data-ms-archive-next="${dept}" ${canGoNext ? '' : 'disabled'}>›</button>
        </div>
        ${rows}
      </div>
    </div>`;
}

function milestoneSection(dept){
  const goals = goalsFor(dept);
  const colorKey = DEPT_COLOR_KEY[dept];
  const doneCount = goals.filter(g => Number(g.current) >= Number(g.target)).length;

  const rows = goals.length
    ? goals.map(g => {
        const cur = Number(g.current), tgt = Math.max(1, Number(g.target));
        const pct = Math.min(100, Math.round(cur / tgt * 100));
        const done = cur >= tgt;
        const unit = escapeHtml(g.unit || '건');
        return `
        <div class="ms-row">
          <div class="ms-row-top">
            <button class="ms-del" data-ms-del="${g.id}" data-ms-title="${escapeHtml(g.title)}">🗑️</button>
            <div class="ms-info">
              <p class="ms-name">${done ? '✅ ' : ''}${escapeHtml(g.title)}</p>
              ${g.desc ? `<p class="ms-desc">${escapeHtml(g.desc)}</p>` : ''}
            </div>
            <div class="ms-counter">
              <button class="ms-btn" data-ms-minus="${g.id}" ${cur <= 0 ? 'disabled' : ''}>−</button>
              <span class="ms-count mono"><span class="cur">${cur}</span> / ${tgt} ${unit}</span>
              <button class="ms-btn" data-ms-plus="${g.id}">+</button>
            </div>
          </div>
          <div class="ms-track"><div class="ms-fill${done ? ' done' : ''}" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')
    : `<div class="ms-empty">아직 등록된 목표가 없습니다.</div>`;

  const isOpen = !state.msCollapsed.has(dept);

  const totalGoals = goals.reduce((s, g) => s + Math.max(1, Number(g.target) || 0), 0);
  const completedGoals = goals.reduce((s, g) => s + Math.min(Math.max(0, Number(g.current) || 0), Math.max(1, Number(g.target) || 0)), 0);
  const goalProgressPct = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
  
  const progressState = goalProgressPct === 0 ? 0 : (goalProgressPct === 100 ? 2 : 1);

  return `
    <div class="ms-panel${isOpen ? ' open' : ''}" style="--dept-color:var(--dept-${colorKey})" data-ms-panel="${dept}" data-progress="${progressState}">
      <button class="ms-head" data-ms-toggle="${dept}">
        <span class="ms-head-left">
          <span class="ms-chevron"></span>
          <span class="ms-title"><span class="ms-dot"></span><span class="ms-title-text"><span class="ms-dept">🎯 ${dept}</span><span class="ms-sub">월간 마일스톤</span></span></span>
        </span>
        <span class="ms-badge">${goals.length ? doneCount + ' / ' + goals.length + ' 달성' : '공유 목표'}</span>
      </button>
      <div class="ms-body">
      ${rows}
      <div class="ms-form">
        <input class="ms-input ms-in-title" data-ms-in="title" placeholder="목표 지표명 입력" maxlength="40">
        <div class="ms-num-group">
          <input class="ms-input ms-in-target mono" data-ms-in="target" type="number" min="1" max="999" placeholder="목표" value="4">
          <select class="ms-input ms-in-unit" data-ms-in="unit">
            <option value="건">건</option><option value="명">명</option><option value="회">회</option><option value="편">편</option><option value="%">%</option>
          </select>
        </div>
        <input class="ms-input ms-in-desc" data-ms-in="desc" placeholder="행동 지침 설명" maxlength="80">
        <button class="ms-add-btn" data-ms-add="${dept}">목표등록</button>
      </div>
      ${msArchiveSection(dept)}
      </div>
    </div>`;
}

function bindMilestoneEvents(){
  document.querySelectorAll('[data-ms-panel]').forEach(panel => {
    const dept = panel.dataset.msPanel;

    const toggle = panel.querySelector('[data-ms-toggle]');
    toggle.onclick = ()=>{
      const nowOpen = !panel.classList.contains('open');
      panel.classList.toggle('open', nowOpen);
      if(nowOpen) state.msCollapsed.delete(dept); else state.msCollapsed.add(dept);
    };

    const archivePanel = panel.querySelector('[data-ms-archive-panel]');
    if(archivePanel){
      const archiveToggle = archivePanel.querySelector('[data-ms-archive-toggle]');
      archiveToggle.onclick = ()=>{
        const nowOpen = !archivePanel.classList.contains('open');
        archivePanel.classList.toggle('open', nowOpen);
        if(nowOpen) state.msArchiveOpen.add(dept); else state.msArchiveOpen.delete(dept);
        render();
      };

      const prevBtn = archivePanel.querySelector('[data-ms-archive-prev]');
      if(prevBtn) prevBtn.onclick = ()=>{
        state.msArchiveMonth[dept] = shiftMonthKey(state.msArchiveMonth[dept] || shiftMonthKey(monthKeyOf(), -1), -1);
        state.msArchiveOpen.add(dept);
        render();
      };
      const nextBtn = archivePanel.querySelector('[data-ms-archive-next]');
      if(nextBtn) nextBtn.onclick = ()=>{
        if(nextBtn.disabled) return;
        state.msArchiveMonth[dept] = shiftMonthKey(state.msArchiveMonth[dept] || shiftMonthKey(monthKeyOf(), -1), +1);
        state.msArchiveOpen.add(dept);
        render();
      };
    }

    panel.querySelectorAll('[data-ms-plus]').forEach(b => b.onclick = ()=> msUpdateGoal(dept, b.dataset.msPlus, +1));
    panel.querySelectorAll('[data-ms-minus]').forEach(b => b.onclick = ()=> msUpdateGoal(dept, b.dataset.msMinus, -1));
    panel.querySelectorAll('[data-ms-del]').forEach(b => b.onclick = ()=> msDeleteGoal(dept, b.dataset.msDel, b.dataset.msTitle));

    const addBtn = panel.querySelector('[data-ms-add]');
    addBtn.onclick = ()=>{
      const get = k => panel.querySelector('[data-ms-in="' + k + '"]');
      const title = get('title').value.trim();
      const target = Number(get('target').value);
      const unit = get('unit').value;
      const desc = get('desc').value.trim();
      if(!title){ get('title').focus(); return; }
      if(!target || target < 1){ get('target').focus(); return; }
      msAddGoal(dept, title, target, unit, desc, addBtn);
    };
  });
}

function monthlyReportItems(){
  const itemsByDate = {};
  const deptCounts = {};
  let total = 0;
  ALL_DEPT_LIST.forEach(dept=>{
    const deptData = state.data.departments[dept];
    const bucket = (deptData && deptData.monthly) || {};
    let deptTotal = 0;
    Object.keys(bucket).forEach(category=>{
      const cat = bucket[category] || {};
      (cat.items || []).forEach(it=>{
        if(!it.date) return;
        const d = new Date(it.date);
        if(isNaN(d)) return;
        const key = dateKey(d);
        if(!itemsByDate[key]) itemsByDate[key] = [];
        itemsByDate[key].push({ ...it, dept, category });
        deptTotal++; total++;
      });
    });
    deptCounts[dept] = deptTotal;
  });
  return { itemsByDate, deptCounts, total };
}

function renderMonthlyReportSection(){
  if(!state.data) return '';
  const { itemsByDate, deptCounts, total } = monthlyReportItems();

  const now = new Date();
  const todayKey = dateKey(now);
  if(state.reportSelectedDate == null || state.reportLastTodayKey !== todayKey){
    state.reportSelectedDate = todayKey;
    state.reportLastTodayKey = todayKey;
  }

  const year = now.getFullYear(), month = now.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  function dayTitles(key){
    const evs = itemsByDate[key];
    if(!evs || !evs.length) return '';
    return '<div class="calendar-day-items">' +
      evs.map(ev=>{
        const c = `var(--dept-${DEPT_COLOR_KEY[ev.dept]})`;
        return `<div class="calendar-day-item" style="--item-color:${c}"><span class="item-dot"></span>${escapeHtml(ev.title||'(제목 없음)')}</div>`;
      }).join('') +
      '</div>';
  }

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<span class="calendar-day-empty"></span>`;
  for(let day=1; day<=totalDays; day++){
    const d = new Date(year, month, day);
    const key = dateKey(d);
    const isToday = key === todayKey;
    const isSelected = key === state.reportSelectedDate;
    cells += `
      <button class="calendar-day ${isToday?'today':''} ${isSelected?'selected':''}" style="--dept-color:var(--blue)" data-report-key="${key}">
        <span>${day}</span>
        ${dayTitles(key)}
      </button>`;
  }

  const summaryChips = ALL_DEPT_LIST.map(dept=>{
    const c = deptCounts[dept] || 0;
    return `<span class="report-chip" style="--chip-color:var(--dept-${DEPT_COLOR_KEY[dept]})"><span class="chip-dot"></span>${dept.slice(0,2)} <b class="mono">${c}</b></span>`;
  }).join('');

  const selectedItems = (itemsByDate[state.reportSelectedDate] || []).slice()
    .sort((a,b)=> ALL_DEPT_LIST.indexOf(a.dept) - ALL_DEPT_LIST.indexOf(b.dept));
  const [sy, sm, sd] = state.reportSelectedDate.split('-');

  const detailRows = selectedItems.length
    ? selectedItems.map(it=>{
        const rowVar = `var(--dept-${DEPT_COLOR_KEY[it.dept]})`;
        return `
        <div class="schedule-row" style="--dept-color:${rowVar}">
          <div class="schedule-info">
            <p class="schedule-title">${escapeHtml(it.title||'(제목 없음)')}</p>
            ${it.content ? `<p class="schedule-meta">${escapeHtml(it.content)}</p>` : ''}
            <span class="schedule-dept-tag">${escapeHtml(it.dept)} · ${escapeHtml(it.category)}${it.reporter ? ' · '+escapeHtml(it.reporter) : ''}</span>
          </div>
        </div>`;
      }).join('')
    : `<div class="schedule-empty">이 날 등록된 보고 항목이 없습니다</div>`;

  return `
    <div class="report-cal">
      <div class="report-cal-head">
        <span class="report-cal-title">🗓️ 월말 통합 보고 캘린더</span>
        <span class="report-cal-month mono">${escapeHtml(state.data.currentMonth || '')} · 총 ${total}건</span>
      </div>
      <div class="report-summary-row">${summaryChips}</div>
      <div class="calendar-dow-row">
        ${['일','월','화','수','목','금','토'].map(d=>`<span class="calendar-dow">${d}</span>`).join('')}
      </div>
      <div class="calendar-grid">${cells}</div>
      <div class="calendar-day-detail">
        <p class="calendar-day-detail-label">${sm}.${sd} 보고 내역</p>
        ${detailRows}
      </div>
    </div>`;
}

function bindReportCalendarEvents(){
  document.querySelectorAll('[data-report-key]').forEach(btn=>{
    btn.onclick = ()=>{ state.reportSelectedDate = btn.dataset.reportKey; render(); };
  });
}

function render(){
  renderBriefing();
  if(document.body.classList.contains('meeting-active')) renderMeetingMode();
  if(document.body.classList.contains('prep-active')) renderSermonPrep();
  renderDeptTabs();
  renderRangeTabs();
  renderMeta();
  renderSharedFollowup();

  const msWrap = document.getElementById('milestoneSection');
  if(!state.dept || !state.data){
    msWrap.innerHTML = '';
  } else if(state.dept === ALL_DEPTS){
    msWrap.innerHTML = renderMonthlyReportSection();
    bindReportCalendarEvents();
  } else {
    msWrap.innerHTML = milestoneSection(state.dept);
    bindMilestoneEvents();
  }

  renderSchedule();

  const main = document.getElementById('main');
  if(!state.data){ return; }

  function deptSection(dept){
    const deptData = state.data.departments[dept] || { weekly:{}, monthly:{}, yearly:{} };
    const allCats = Array.from(new Set([
      ...Object.keys(deptData.weekly),
      ...Object.keys(deptData.monthly),
      ...Object.keys(deptData.yearly)
    ]));
    return `
      <p class="section-label">${dept} · 분류별 현황</p>
      ${allCats.length
        ? allCats.map(c=>catCard(dept, deptData, c, dept + '|' + c)).join('')
        : `<div class="state-box">이 부서에 등록된 분류가 아직 없습니다.</div>`}`;
  }

  if(!state.dept){
    main.innerHTML = `<div class="state-box"><p class="big">부서를 선택해주세요</p>위의 부서 카드를 누르면 캘린더와 분류별 상세 현황이 표시됩니다.</div>`;
    return;
  }

  if(state.dept === ALL_DEPTS){
    main.innerHTML = ALL_DEPT_LIST.map(deptSection).join('') + queueSection();
  } else {
    main.innerHTML = deptSection(state.dept) + queueSection();
  }

  main.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.toggle;
      if(state.openCats.has(key)) state.openCats.delete(key); else state.openCats.add(key);
      render();
    };
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showError(){
  document.getElementById('main').innerHTML = `
    <div class="state-box">
      <p class="big">데이터를 불러오지 못했습니다</p>
      네트워크 상태를 확인하거나 잠시 후 다시 시도해주세요.
      <br><button class="retry-btn" onclick="load()">다시 시도</button>
    </div>`;
}

function renderAlertBanner(){
  const wrap = document.getElementById('alertBanner');
  const now = new Date();
  const day = now.getDay();
  const hour = now.getHours();
  const forceTest = new URLSearchParams(location.search).get('forceAlert') === '1';
  const inWindow = forceTest || (day === 6 && (hour === 20 || hour === 21 || hour === 22));

  const unreported = (state.data && state.data.unreportedDepartments) || [];

  if(!inWindow || unreported.length === 0){ wrap.innerHTML=''; return; }

  const dismissKey = 'alertDismissed-' + now.toISOString().slice(0,10) + '-' + hour;
  let dismissed = false;
  try{ dismissed = localStorage.getItem(dismissKey) === '1'; }catch(e){}
  if(dismissed){ wrap.innerHTML=''; return; }

  wrap.innerHTML = `
    <div class="alert-banner">
      <span class="alert-icon"></span>
      <div class="alert-body">
        <p class="alert-title">이번 주 미보고 부서 ${unreported.length}곳</p>
        <p class="alert-desc">${unreported.join(', ')} — 오늘(토요일) 안에 보고 부탁드립니다.</p>
      </div>
      <button class="alert-close" id="alertCloseBtn">×</button>
    </div>`;

  document.getElementById('alertCloseBtn').onclick = ()=>{
    try{ localStorage.setItem(dismissKey, '1'); }catch(e){}
    wrap.innerHTML = '';
  };
}

async function load(){
  if(!state.data){
    document.getElementById('main').innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  }
  try{
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('bad status');
    state.data = await res.json();
    
    if(state.data && state.data.sharedMeeting) {
      if(state.data.sharedMeeting.decisions) {
        state.data.sharedMeeting.decisions = state.data.sharedMeeting.decisions.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
      }
      if(state.data.sharedMeeting.next) {
        state.data.sharedMeeting.next = state.data.sharedMeeting.next.filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
      }
    }

    syncSermonFromServer();

    await checkMonthlyMilestoneReset();
    if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.ms-form')){
      renderVisitFooter();
      renderSharedFollowup();
      return;
    }
    render();
    renderSharedFollowup();
    renderAlertBanner();
    renderNoticeToast();
    renderVisitFooter();
  }catch(err){
    console.error(err);
    showError();
  }
}

/* ================= 말씀 전달 로직 ================= */
const SERMON_KEY='cultureSermonPrepV3';

const PPT_STYLE_DEFAULT={
  font:'Noto Sans KR',
  theme:'dark',
  accent:'#FF9F0A',
  titleSize:34,
  headingSize:20,
  bodySize:18,
  align:'LEFT',
  margin:'normal',
  charsPerSlide:380,
  showCover:1,
  showOutro:1
};

const PPT_FONT_OPTIONS=[
  ['Noto Sans KR','본고딕 (기본)'],
  ['Nanum Gothic','나눔고딕'],
  ['Nanum Myeongjo','나눔명조'],
  ['Gothic A1','고딕 A1'],
  ['Gowun Dodum','고운돋움'],
  ['Do Hyeon','도현체'],
  ['Jua','주아체'],
  ['Black Han Sans','검은고딕']
];
const PPT_THEME_OPTIONS=[['dark','다크 (검정)'],['navy','딥네이비'],['ink','잉크블랙'],['light','라이트 (흰색)']];
const PPT_ACCENT_OPTIONS=[['#FF9F0A','오렌지'],['#0A84FF','블루'],['#30D158','그린'],['#BF5AF2','퍼플'],['#FF453A','레드'],['#8E8E93','그레이']];
const PPT_MARGIN_OPTIONS=[['narrow','좁게 (글자 크게)'],['normal','보통'],['wide','넓게 (여백 크게)']];

let sermonState={topic:'', main:'', pptUrl:'', embedUrl:'', savedAt:'', updatedAt:'', updatedBy:'', pptNonce:0, pptStyle:{...PPT_STYLE_DEFAULT}};
let sermonDirty=false;
let sermonSyncedOnce=false;
let pptStyleOpen=false;

function pptStyle(){ return {...PPT_STYLE_DEFAULT, ...(sermonState.pptStyle||{})}; }

function loadSermonLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem(SERMON_KEY)||'{}');
    sermonState={...sermonState,...raw};
    sermonState.pptStyle={...PPT_STYLE_DEFAULT,...(raw.pptStyle||{})};
  }catch(e){}
}
function persistSermonLocal(){
  try{ localStorage.setItem(SERMON_KEY,JSON.stringify(sermonState)); }catch(e){}
}
function isTypingInSermon(){
  const a=document.activeElement;
  if(!a||!a.closest||!a.closest('#sermonPrep')) return false;
  return a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT';
}

function syncSermonFromServer(){
  const s=state.data && state.data.sharedSermon;
  if(!s) return;
  if(sermonDirty || isTypingInSermon()) return;

  const serverTime=Date.parse(s.updatedAt||'')||0;
  const localTime=Date.parse(sermonState.updatedAt||'')||0;
  if(sermonSyncedOnce && serverTime<localTime) return;

  const prevPpt=sermonState.pptUrl;
  sermonState.topic    = s.topic||'';
  sermonState.main     = s.main||'';
  sermonState.pptUrl   = s.pptUrl||'';
  sermonState.embedUrl = s.embedUrl||'';
  sermonState.updatedAt= s.updatedAt||'';
  sermonState.updatedBy= s.updatedBy||'';
  sermonState.pptStyle = {...PPT_STYLE_DEFAULT, ...(s.pptStyle||{})};
  if(prevPpt!==sermonState.pptUrl) sermonState.pptNonce=Date.now();
  if(s.updatedAt){
    const d=new Date(s.updatedAt);
    if(!isNaN(d)) sermonState.savedAt=d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }
  sermonSyncedOnce=true;
  persistSermonLocal();
  if(document.body.classList.contains('prep-active')) renderSermonPrep();
}

let sermonSaveTimer=null;
async function pushSermonToServer(show){
  try{
    const res=await apiAction('sermonSave',{data:JSON.stringify({
      topic:    sermonState.topic||'',
      main:     sermonState.main||'',
      pptUrl:   sermonState.pptUrl||'',
      embedUrl: sermonState.embedUrl||'',
      pptStyle: pptStyle()
    })});
    if(res && res.ok){
      sermonDirty=false;
      sermonSyncedOnce=true;
      if(res.sermon && res.sermon.updatedAt){
        sermonState.updatedAt=res.sermon.updatedAt;
        const d=new Date(res.sermon.updatedAt);
        if(!isNaN(d)) sermonState.savedAt=d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      }
      persistSermonLocal();
      if(show) showMeetingToast('문화부 전체에 공유 저장되었습니다 ✅');
      return true;
    }
    if(show) showMeetingToast('서버 저장 실패 — Apps Script 배포 권한을 확인해 주세요.');
  }catch(e){
    console.error(e);
    if(show) showMeetingToast('서버 저장 실패 — 네트워크를 확인해 주세요.');
  }
  return false;
}

function saveSermonState(show=false){
  sermonDirty=true;
  persistSermonLocal();
  renderPrepSaved();
  clearTimeout(sermonSaveTimer);
  sermonSaveTimer=setTimeout(async()=>{
    await pushSermonToServer(show);
    renderPrepSaved();
  }, show?0:900);
}

function updateSermon(k,v){ sermonState[k]=v; saveSermonState(false); }

function updatePptStyle(k,v){
  const st=pptStyle();
  st[k]=(typeof PPT_STYLE_DEFAULT[k]==='number')?Number(v):v;
  sermonState.pptStyle=st;
  const label=document.getElementById('pptv-'+k);
  if(label) label.textContent=(k==='charsPerSlide')?(st[k]+'자'):(st[k]+'pt');
  saveSermonState(false);
}

function togglePptStyle(){
  pptStyleOpen=!pptStyleOpen;
  const el=document.getElementById('pptStylePanel');
  if(el) el.classList.toggle('open', pptStyleOpen);
}

async function reloadSermonFromServer(){
  sermonDirty=false;
  sermonSyncedOnce=false;
  showMeetingToast('최신 공유본을 불러오는 중...');
  await load();
  syncSermonFromServer();
  renderSermonPrep();
  showMeetingToast('최신 공유본을 불러왔습니다.');
}

function renderPrepSaved(){
  const e=document.getElementById('prepSaved');
  if(!e) return;
  if(sermonDirty){ e.textContent='저장 대기 중… (자동 저장됩니다)'; return; }
  e.textContent = sermonState.savedAt ? `전체 공유 저장됨 · ${sermonState.savedAt}` : '작성 후 자동으로 전체 공유됩니다';
}

async function createPptFromSermon(){
  const topic=(sermonState.topic||'').trim();
  const main=(sermonState.main||'').trim();
  if(!topic && !main){ showMeetingToast('주제 또는 상세 전달 내용을 입력해 주세요.'); return; }

  const rebuilding=!!sermonState.pptUrl;
  showMeetingToast(rebuilding?'디자인을 반영해 슬라이드를 다시 그리는 중… ⏳':'내용을 저장하고 PPT를 제작합니다… ⏳');
  await pushSermonToServer(false);

  try{
    const res=await apiAction('createPPT',{ data:JSON.stringify({
      topic, main,
      date:new Date().toISOString().slice(0,10),
      style:pptStyle()
    })});
    if(res && res.ok){
      sermonState.pptUrl   = res.editUrl || res.url || '';
      sermonState.embedUrl = res.embedUrl || '';
      sermonState.pptNonce = Date.now();
      persistSermonLocal();
      await pushSermonToServer(false);
      renderSermonPrep();
      showMeetingToast(res.warning ? ('완료 — ' + res.warning) : (rebuilding?'디자인이 반영되었습니다 🎨':'PPT가 생성되어 전체에 공유되었습니다 🎉'));
    }else{
      showMeetingToast('PPT 생성 실패: ' + ((res && res.error) || '알 수 없는 오류'));
    }
  }catch(e){
    console.error(e);
    showMeetingToast('PPT 제작 요청 중 오류가 발생했습니다.');
  }
}

function openPptEditor(){
  if(!sermonState.pptUrl){ showMeetingToast('먼저 PPT를 제작해 주세요.'); return; }
  window.open(sermonState.pptUrl,'_blank','noopener');
}

function toEmbedUrl(url){
  if(!url) return '';
  const m=String(url).match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? `https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false&delayms=3000` : '';
}

function selectField(key,label,options){
  const cur=String(pptStyle()[key]);
  const opts=options.map(([v,t])=>`<option value="${escapeHtml(String(v))}" ${String(v)===cur?'selected':''}>${escapeHtml(t)}</option>`).join('');
  return `<label class="ppt-style-field"><span>${escapeHtml(label)}</span>
    <select onchange="updatePptStyle('${key}',this.value)">${opts}</select></label>`;
}
function rangeField(key,label,min,max,step,suffix){
  const v=pptStyle()[key];
  return `<label class="ppt-style-field"><span>${escapeHtml(label)}<b class="ppt-style-val" id="pptv-${key}">${v}${suffix}</b></span>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="updatePptStyle('${key}',this.value)"></label>`;
}

  notes:'' 
};

function checkWeeklyReset() {
  // 수동 삭제 전까지 현황판 목록 유지
}

function loadMeetingState(){
  checkWeeklyReset();

  try{
    meetingState={...meetingState,...JSON.parse(localStorage.getItem(MEETING_KEY)||'{}')};
  }catch(e){}

  meetingState.decisions = (meetingState.decisions || []).filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');
  meetingState.next = (meetingState.next || []).filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');

let meetingSaveTimer=null;
function saveMeetingState(immediate=false){
  const generatedText = generateMeetingText();
  const x = {
    ...meetingState,
    status: '완료',
    completedAt: new Date().toISOString(),
    minutes: generatedText,
    sermon: sermonState
  };

  try{ localStorage.setItem(MEETING_KEY, JSON.stringify(x)); }catch(e){}
  clearTimeout(meetingSaveTimer);

  meetingSaveTimer = setTimeout(async () => {
    try {
      await apiAction('meetingSave', { data: JSON.stringify(x) });
      renderSharedFollowup();
      if(immediate) showMeetingToast('회의록 저장 및 공용 공유가 완료되었습니다.');
    } catch(e) {
      console.error(e);
    }
  }, immediate ? 0 : 650);
}

function selectMeetingDept(i){
  meetingState.deptIndex = i;
  saveMeetingState();
  renderMeetingMode();
}

function generateMeetingText(){
  const formatListByDept = (items) => {
    if(!items || items.length === 0) return '없음';
    let res = [];
    DEPTS.forEach(d => {
      const dItems = items.filter(x => x.dept === d);
      if(dItems.length > 0){
        res.push(`[${d}]`);
        dItems.forEach((x, i) => res.push(`  ${i+1}. ${x.text}`));
      }
    });
    return res.length > 0 ? res.join('\n') : '없음';
  };

  return `[문화부 주간 피드백 전체 회의록]
일시: ${new Date().toLocaleString('ko-KR')}

■ 1. 회의 총평 및 특이사항 메모 (문화부 전체)
${meetingState.notes || '없음'}

■ 2. 차주에 할 일 (과별 계획)
${formatListByDept(meetingState.next)}

■ 3. 과별 피드백 및 지시사항
${formatListByDept(meetingState.decisions)}`;
}

  const goals = goalsFor(currentDept);
  const totalGoals = goals.reduce((s, g) => s + Math.max(1, Number(g.target) || 0), 0);
  const completedGoals = goals.reduce((s, g) => s + Math.min(Math.max(0, Number(g.current) || 0), Math.max(1, Number(g.target) || 0)), 0);
  const goalProgressPct = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
  const doneGoalCount = goals.filter(g => Number(g.current) >= Number(g.target)).length;

  const currentGoalsHtml = goals.length > 0
    ? goals.map(g => {
        const cur = Number(g.current), tgt = Math.max(1, Number(g.target));

function addFeedbackItem(type){
  const inputEl = document.getElementById(type === 'next' ? 'inputNext' : 'inputDecisions');
  const val = inputEl ? inputEl.value.trim() : '';
  if(!val) return;

  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  if(!meetingState[type]) meetingState[type] = [];

  meetingState[type].push({
    text: val,
    done: false,
    dept: currentDept
  });

  inputEl.value = '';
  saveMeetingState();
  renderMeetingMode();
}

function removeFeedbackItem(type, text){
  const currentDept = DEPTS[meetingState.deptIndex] || DEPTS[0];
  if(!meetingState[type]) return;

  meetingState[type] = meetingState[type].filter(x => !(x.dept === currentDept && x.text === text));
  saveMeetingState();
  renderMeetingMode();
}

async function apiAction(action,params={}){
  const parse=t=>{ try{return JSON.parse(t)}catch(e){return {ok:t==='ok',raw:t}} };
  try{
    const r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,...params}),
      redirect:'follow'
    });
    return parse(await r.text());
  }catch(err){
    const q=new URLSearchParams({action,...params});
    const r=await fetch(API_URL+'?'+q.toString(),{cache:'no-store'});
    return parse(await r.text());
  }
}

function normalizeSharedMeeting(raw){
  const base=raw&&typeof raw==='object'?raw:{};
  const fix=arr=>(Array.isArray(arr)?arr:[])
    .map(x=>typeof x==='string'?{text:x,done:false,dept:'전체'}:{...x,text:String(x.text||''),done:!!x.done,dept:x.dept||'전체'})
    .filter(x => x.dept !== '전체' && x.text !== 'ㄴㅇㄹㄴㅇㄹ');

  return {...base,decisions:fix(base.decisions),next:fix(base.next)};
}

function getSharedMeeting(){
  const server=state.data?.sharedMeeting;
  const local=meetingState;
  const chosen=(server&&(server.decisions?.length||server.next?.length))?server:local;
  return normalizeSharedMeeting(chosen||{});
}

function getMeetingArchiveData(){
  const server=Array.isArray(state.data?.meetingArchive)?state.data.meetingArchive:[];
  let local=[];try{local=JSON.parse(localStorage.getItem('cultureMeetingArchiveV1')||'[]')}catch(e){}
  const current=getSharedMeeting();
  const currentFinished=current.status==='완료'?( [{id:current.id||current.completedAt||'current',status:'완료',startedAt:current.startedAt||'',endedAt:current.completedAt||'',seconds:current.seconds||0,decisions:current.decisions||[],next:current.next||[],minutes:current.minutes||generateMeetingText()}] ):[];
  const all=[...server,...currentFinished,...local];
  const seen=new Set();
  return all.filter(x=>{const k=String(x.id||x.endedAt||x.startedAt||x.minutes||'');if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.endedAt||b.startedAt||0)-new Date(a.endedAt||a.startedAt||0));
}

function archiveWeekLabel(item){
  const d=new Date(item.endedAt||item.startedAt||Date.now());
  if(isNaN(d))return '날짜 미정';
  
  const day = d.getDay();
  const diffToSunday = d.getDate() - day;
  const sun = new Date(d); sun.setDate(diffToSunday);
  const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  
  const f = x => `${x.getMonth()+1}.${x.getDate()}`;
  return `${d.getFullYear()}년 ${f(sun)}–${f(sat)}`;
}

// ★ 기본모드 회의 후속 업무 카드 항목 삭제 함수
function removeSharedItem(type, originalIdx) {
  const shared = getSharedMeeting();
  if (!shared[type] || !shared[type][originalIdx]) return;
  
  shared[type].splice(originalIdx, 1);
  meetingState[type] = shared[type];
  
  if (state.data) state.data.sharedMeeting = shared;
  saveMeetingState(true);
  renderSharedFollowup();
}

function renderSharedFollowup(){
  const el=document.getElementById('sharedFollowup');if(!el)return;
  const m=getSharedMeeting();
  const selected=state.dept||ALL_DEPTS;
  const matches=x=>selected===ALL_DEPTS||x.dept===selected;
  const decisions=m.decisions.filter(matches),next=m.next.filter(matches);
  const archiveCount=getMeetingArchiveData().length;
  if(!decisions.length&&!next.length&&!archiveCount){el.innerHTML='';return}
  const originalIndex=(type,item)=>m[type].findIndex(x=>x===item||[x.text,x.dept].join('|')===[item.text,item.dept].join('|'));
  
  // ★ 항목 우측에 삭제(✕) 버튼 추가
  const rows=(arr,type)=>arr.map(item=>{
    const i=originalIndex(type,item);
    return `<div class="shared-item ${item.done?'is-done':''}">
      <label class="shared-item-left">
        <input type="checkbox" ${item.done?'checked':''} onchange="sharedToggle('${type}',${i},this.checked)">
        <span class="shared-item-body">
          <span class="shared-item-title">
            <b>${escapeHtml(item.text)}</b>
            <span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[item.dept]||'culture'})">${escapeHtml(item.dept)}</span>
          </span>
          <div class="shared-meta">${type==='next'?'차주 중점 업무':'회의 피드백 지시사항'}${item.done?' · 완료됨':' · 진행 확인 필요'}</div>
        </span>
      </label>
      <button class="shared-del-btn" onclick="removeSharedItem('${type}',${i})" title="삭제">✕</button>
    </div>`
  }).join('')||'<div class="shared-empty">이 부서에 등록된 내용이 없습니다.</div>';

  const scope=selected===ALL_DEPTS?'전체 부서':selected;
  el.innerHTML=`<div class="shared-scope"><div class="shared-head-actions"><span>${escapeHtml(scope)} · 회의 후속 업무</span><button class="archive-open-btn" onclick="openMeetingArchive('${escapeHtml(scope)}')">🗂 지난 회의록 보기${archiveCount?` · ${archiveCount}회`:''}</button></div></div><div class="shared-followup"><div class="shared-card"><h3><span>🚀 차주 중점 업무</span><span class="sync-state">${next.length}건 · 공용 저장</span></h3><div class="shared-list">${rows(next,'next')}</div></div><div class="shared-card"><h3><span>💡 지시사항 & 피드백</span><span class="sync-state">${decisions.length}건 · 공용 저장</span></h3><div class="shared-list">${rows(decisions,'decisions')}</div></div></div>`
}

function sharedToggle(type,i,v){
  const shared=getSharedMeeting();
  if(shared[type]?.[i]){
    shared[type][i].done=v;
    meetingState={...meetingState,...shared};
    if(state.data)state.data.sharedMeeting={...shared};
    saveMeetingState(true);renderSharedFollowup();
  }
}

function openMeetingArchive(defaultDept){
  const host=document.getElementById('meetingArchiveHost');if(!host)return;
  const selected=(defaultDept&&defaultDept!=='전체 부서')?defaultDept:(state.dept&&state.dept!==ALL_DEPTS?state.dept:'전체 부서');
  host.innerHTML=`<div class="meeting-archive-overlay" onclick="if(event.target===this)closeMeetingArchive()"><div class="meeting-archive-modal"><div class="archive-modal-head"><h2>🗂 지난 회의록</h2><button class="archive-close" onclick="closeMeetingArchive()">✕</button></div><div class="archive-filters"><select class="archive-select" id="archiveDept" onchange="renderMeetingArchiveBody()"><option>전체 부서</option>${DEPTS.map(d=>`<option ${d===selected?'selected':''}>${d}</option>`).join('')}</select><select class="archive-select" id="archiveWeek" onchange="renderMeetingArchiveBody()"></select></div><div class="archive-body" id="archiveBody"></div></div></div>`;
  const archive=getMeetingArchiveData();
  const week=document.getElementById('archiveWeek');
  week.innerHTML=archive.map((x,i)=>`<option value="${i}">${archiveWeekLabel(x)}</option>`).join('')||'<option value="">저장된 회의 없음</option>';
  renderMeetingArchiveBody();
}

function closeMeetingArchive(){const h=document.getElementById('meetingArchiveHost');if(h)h.innerHTML=''}

function renderMeetingArchiveBody(){
  const body=document.getElementById('archiveBody'),week=document.getElementById('archiveWeek'),deptEl=document.getElementById('archiveDept');if(!body||!week||!deptEl)return;
  const archive=getMeetingArchiveData();const item=archive[Number(week.value)||0];
  if(!item){body.innerHTML='<div class="archive-empty">저장된 지난 회의록이 없습니다.</div>';return}
  const dept=deptEl.value;
  const match=x=>x.dept!=='전체' && (dept==='전체 부서'||x.dept===dept);
  const list=(arr,label)=>(Array.isArray(arr)?arr:[]).filter(match).map(x=>`<div class="archive-row ${x.done?'done':''}"><span class="archive-status">${x.done?'✅':'▫️'}</span><span class="archive-row-text">${escapeHtml(x.text||'')}</span><span class="shared-dept-badge" style="--badge-color:var(--dept-${DEPT_COLOR_KEY[x.dept]||'culture'})">${escapeHtml(x.dept||'전체')}</span></div>`).join('')||`<div class="archive-empty">${label}이 없습니다.</div>`;
  const dt=new Date(item.endedAt||item.startedAt||Date.now());
  body.innerHTML=`<div class="archive-summary"><b>${escapeHtml(archiveWeekLabel(item))}</b><span>${isNaN(dt)?'':dt.toLocaleString('ko-KR')}</span></div><div class="archive-section"><h3>🚀 차주 할 일</h3>${list(item.next,'차주 할 일')}</div><div class="archive-section"><h3>💡 지시사항 및 피드백</h3>${list(item.decisions,'지시사항 및 피드백')}</div><div class="archive-section"><h3>📝 전체 회의록</h3><div class="archive-minutes">${escapeHtml(item.minutes||'회의록 본문이 없습니다.')}</div></div>`;
}

function initModeSwitch(){
  loadMeetingState();
  loadSermonLocal();
  const saved=localStorage.getItem('dashboardViewMode')||'normal';
  document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setDashboardMode(b.dataset.mode));
  setDashboardMode(saved);
}

document.addEventListener('DOMContentLoaded',initModeSwitch);

load();
setInterval(load, 60000);
</script>
</body>
